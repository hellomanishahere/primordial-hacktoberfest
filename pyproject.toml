[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "primordial"
version = "1.0.0"
description = "AI-powered Open Source Decision Intelligence & Knowledge Recovery Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Primordial Engineering Team", email = "team@primordial.dev"}
]
keywords = ["hacktoberfest", "decision-intelligence", "adr", "ai", "madr", "knowledge-recovery"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["primordial*"]
