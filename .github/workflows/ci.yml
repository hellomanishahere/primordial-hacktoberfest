name: Primordial CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-validation:
    name: Application Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install -e .

      - name: Validate required files and example artifacts
        run: |
          test -f README.md
          test -f LICENSE
          test -f HACKATHON.md
          test -f .github/pull_request_template.md
          test -f .github/workflows/ci.yml
          test -s examples/README.md
          test -s examples/uv-config/input.json
          test -s examples/uv-config/actual-output.json

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run curated fixture benchmark
        run: python benchmarks/evaluate.py

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install security scanners and project
        run: python -m pip install -e . bandit pip-audit
      - name: Scan Python source for high-severity security issues
        run: bandit -q -r primordial -lll
      - name: Audit installed Python dependencies
        run: pip-audit --local --strict
