name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]

jobs:
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit for uncommitted or exposed secrets
        run: |
          echo "Scanning tracked files for accidentally committed credentials..."
          ! git grep -iE 'github_pat_[0-9a-zA-Z_]{30,}|ghp_[0-9a-zA-Z]{36}' -- ':!.github/workflows/ci.yml' || (echo "ERROR: GitHub token found in repository!" && exit 1)
          ! git ls-files | grep -iE '\.env$|\.db$' || (echo "ERROR: Tracked .env or database files found!" && exit 1)

  backend-test:
    name: Backend Tests (Python ${{ matrix.python-version }})
    needs: security-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Dependency integrity check
        run: pip check

      - name: Run Pytest test suite
        run: |
          PYTHONPATH=backend pytest tests/ -v

  frontend-test:
    name: Frontend Build & Typecheck (Node.js 20.x)
    needs: security-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript type check
        run: |
          cd frontend
          npx tsc -b

      - name: Build production bundle
        run: |
          cd frontend
          npm run build
