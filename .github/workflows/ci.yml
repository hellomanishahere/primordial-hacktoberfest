name: Primordial CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-validation:
    name: Application validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Validate required files and example artifacts
        run: |
          test -f README.md
          test -f LICENSE
          test -f HACKATHON.md
          test -f .github/pull_request_template.md
          test -f .github/workflows/ci.yml
          test -s examples/README.md
          test -s examples/uv-config/input.json
          test -s examples/uv-config/actual-output.json
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run curated fixture benchmark
        run: python benchmarks/evaluate.py

  backend-validation:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/ -v

  frontend-validation:
    name: Frontend dependency audit and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install main application and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . bandit pip-audit
      - name: Scan main application source
        run: bandit -q -r primordial -lll
      - name: Audit main application dependencies
        run: pip-audit --local --strict
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Scan backend source
        run: bandit -q -r backend/app -lll
      - name: Audit backend dependencies
        run: pip-audit --strict -r backend/requirements.txt
